name: Deploy Flutter Web to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web platform files
        working-directory: client
        run: flutter create --platforms=web .

      - name: Resolve Flutter dependencies
        working-directory: client
        run: flutter pub get

      - name: Build web app
        working-directory: client
        run: flutter build web --release

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli deploy --prod --dir=client/build/web --auth="$NETLIFY_AUTH_TOKEN" --site="$NETLIFY_SITE_ID"
