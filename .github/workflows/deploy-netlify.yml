name: Deploy Flutter Web to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate web platform files
        working-directory: client
        run: flutter create --platforms=web .

      - name: Resolve Flutter dependencies
        working-directory: client
        run: flutter pub get

      - name: Build web app
        working-directory: client
        env:
          API_URL: ${{ secrets.API_URL }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          test -n "$API_URL" || { echo "::error::Set the API_URL repository secret"; exit 1; }
          test -n "$FIREBASE_API_KEY" || { echo "::error::Set the Firebase web configuration secrets"; exit 1; }
          test -n "$FIREBASE_APP_ID" || exit 1
          test -n "$FIREBASE_MESSAGING_SENDER_ID" || exit 1
          test -n "$FIREBASE_PROJECT_ID" || exit 1
          flutter build web --release \
            --dart-define="API_URL=$API_URL" \
            --dart-define="FIREBASE_API_KEY=$FIREBASE_API_KEY" \
            --dart-define="FIREBASE_APP_ID=$FIREBASE_APP_ID" \
            --dart-define="FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define="FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli deploy --prod --dir=client/build/web --auth="$NETLIFY_AUTH_TOKEN" --site="$NETLIFY_SITE_ID"
